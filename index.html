<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What Should I...?</title>
    <link rel="stylesheet" href="/src/css/styles.css" />
  </head>
  <body>
    <main class="container">
      <header>
        <h1>What Should I...?</h1>
        <p class="subtitle">Your personalized recommendation tool</p>
      </header>

      <section class="preferences">
        <h2>Tell me your preferences</h2>
        <form id="preference-form">
          <div class="form-group">
            <label for="movie-query">Describe the kind of movie you want</label>
            <input
              type="text"
              id="movie-query"
              name="movie-query"
              placeholder="e.g. a tense 90s thriller under two hours"
              required
            />
          </div>
          <button type="submit" class="btn-primary">Get Recommendations</button>
        </form>
      </section>

      <section class="results" id="results">
        <h2>Recommendations</h2>
        <div id="recommendation-list" class="recommendation-list">
          <p class="placeholder">
            Fill out your preferences and click "Get Recommendations" to see
            results.
          </p>
        </div>
      </section>
    </main>

    <!-- Load app as ES module for Vite -->
    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
